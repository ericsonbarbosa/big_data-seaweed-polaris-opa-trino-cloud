# ==============================================================================
# 1. INSTALAÇÃO DO POSTGRESQL E SERVIÇO
# ==============================================================================
- name: "Postgres : Instalar PostgreSQL"
  apt:
    name: 
      - postgresql
      - python3-psycopg2  # Necessário para os módulos postgresql_ do Ansible
    state: present
  become: yes

- name: "Postgres : Garantir que o serviço está rodando"
  systemd:
    name: postgresql
    state: started
    enabled: yes
  become: yes

# ==============================================================================
# 2. DETECÇÃO DINÂMICA DA VERSÃO INSTALADA (NOVO!)
# ==============================================================================
- name: "Postgres : Descobrir a versão do PostgreSQL instalada"
  shell: |
    # pg_lsclusters é específico de Debian/Ubuntu e retorna:
    # Ver Cluster   Port Status Owner    Data directory
    # 12  main      5432 online postgres /var/lib/postgresql/12/main
    pg_lsclusters -h | awk 'NR==1 {print $1}'
  register: postgres_version_detected
  changed_when: false
  become: yes

- name: "Postgres : Definir caminho dinâmico do diretório de configuração"
  set_fact:
    postgresql_conf_dir: "/etc/postgresql/{{ postgres_version_detected.stdout | trim }}/main"
    postgresql_version: "{{ postgres_version_detected.stdout | trim }}"

- name: "Postgres : Exibir versão e caminho detectados"
  debug:
    msg: 
      - "Versão do PostgreSQL detectada: {{ postgresql_version }}"
      - "Diretório de configuração: {{ postgresql_conf_dir }}"

- name: "Postgres : Validar que o diretório de configuração existe"
  stat:
    path: "{{ postgresql_conf_dir }}"
  register: postgres_conf_dir_stat
  become: yes

- name: "Postgres : Falhar se o diretório de configuração não for encontrado"
  fail:
    msg: "Diretório {{ postgresql_conf_dir }} não existe! Verifique a instalação do PostgreSQL."
  when: not postgres_conf_dir_stat.stat.exists

# ==============================================================================
# 3. DIRETÓRIO TEMPORÁRIO PARA EXECUÇÃO REMOTA DO ANSIBLE
# ==============================================================================
- name: "Postgres : Criar diretório tmp para execução remota do Ansible"
  file:
    path: /var/lib/postgresql/.ansible/tmp
    state: directory
    owner: postgres
    group: postgres
    mode: '0755'
  become: yes

# ==============================================================================
# 4. CRIAÇÃO DO BANCO DE DADOS E USUÁRIO PARA O POLARIS
# ==============================================================================
- name: "Postgres : Criar banco de dados para o Apache Polaris"
  become: yes
  become_user: postgres
  postgresql_db:
    name: "{{ polaris_db_name | default('polaris_db') }}"

- name: "Postgres : Criar usuário para o Polaris e definir senha"
  become: yes
  become_user: postgres
  no_log: true
  postgresql_user:
    name: "{{ polaris_db_user | default('polaris_user') }}"
    password: "{{ polaris_db_pass | default('polaris_pass_secret') }}"
    encrypted: yes
    state: present

- name: "Postgres : Garantir privilégios 'ALL' no banco do Polaris"
  become: yes
  become_user: postgres
  postgresql_privs:
    db: "{{ polaris_db_name | default('polaris_db') }}"
    objs: ALL_IN_SCHEMA
    schema: public
    type: table
    role: "{{ polaris_db_user | default('polaris_user') }}"
    privs: ALL
    state: present

# ==============================================================================
# 5. CONFIGURAÇÕES DE ACESSO (SUBSTITUINDO HIVE POR POLARIS)
# ==============================================================================
- name: "Postgres : Configurar acesso para o Polaris no pg_hba.conf"
  lineinfile:
    path: "{{ postgresql_conf_dir }}/pg_hba.conf"
    line: "host    {{ polaris_db_name | default('polaris_db') }}    {{ polaris_db_user | default('polaris_user') }}    {{ polaris_allowed_network | default('192.168.56.0/24') }}    md5"
    insertafter: EOF
  become: yes
  notify: "restart postgres"

- name: "Postgres : Escutar em todas as interfaces"
  lineinfile:
    path: "{{ postgresql_conf_dir }}/postgresql.conf"
    regexp: "^#?listen_addresses ="
    line: "listen_addresses = '*'"
  become: yes
  notify: "restart postgres"
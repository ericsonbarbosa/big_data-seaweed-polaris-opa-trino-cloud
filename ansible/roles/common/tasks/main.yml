---
# ==============================================================================
# 2. ATUALIZAÇÃO DO SISTEMA E DEPENDÊNCIAS ESSENCIAIS
# ==============================================================================
- name: "common : Atualizar cache do apt"
  apt:
    update_cache: yes
    cache_valid_time: 3600
  become: yes

- name: "Common : Instalar dependências básicas"
  apt:
    name:
      - python3-pip
      - python3-psycopg2
      - wget
      - curl
      - unzip
      - acl
      - tar
      - gzip
    state: present
    update_cache: yes
  become: yes

- name: "Common : Atualizar pip"
  pip:
    name: pip
    state: latest
  become: yes

- name: "common : Instalar ferramentas de diagnóstico de rede"
  apt:
    name:
      - net-tools
      - iputils-ping
      - telnet
      - traceroute
    state: present
  become: yes